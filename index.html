<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>الرصيد التراكمي المباشر</title><style>:root{--bg:#0f172a;--card-bg:#1e293b;--accent:#10b981;--text-main:#f8fafc;--text-sub:#94a3b8;--border:#334155}*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,sans-serif}body{background-color:var(--bg);color:var(--text-main);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:16px}.container{width:100%;max-width:420px;background-color:var(--card-bg);border-radius:24px;padding:24px;box-shadow:0 20px 25px -5px rgba(0,0,0,0.3);border:1px solid var(--border)}.header{text-align:center;margin-bottom:20px}.header h1{font-size:1.2rem;color:var(--text-sub);font-weight:500;margin-bottom:6px}.badge{display:inline-flex;align-items:center;gap:6px;background:rgba(16,185,129,0.15);color:var(--accent);padding:4px 12px;border-radius:20px;font-size:0.85rem;font-weight:600}.dot{width:8px;height:8px;background-color:var(--accent);border-radius:50%;display:inline-block;animation:pulse 1.5s infinite}.main-card{background:linear-gradient(135deg,#059669 0%,#10b981 100%);border-radius:20px;padding:24px 16px;text-align:center;color:#fff;margin-bottom:20px;box-shadow:0 10px 15px -3px rgba(16,185,129,0.2)}.main-card .label{font-size:0.85rem;opacity:0.9;margin-bottom:8px}.main-card .amount{font-size:2.3rem;font-weight:800;font-family:monospace;letter-spacing:-0.5px}.main-card .currency{font-size:0.95rem;margin-top:4px}.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}.stat-item{background-color:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:16px;padding:12px;text-align:center}.stat-item .val{font-size:1rem;font-weight:700;margin-top:4px;font-family:monospace}.stat-item .lbl{font-size:0.75rem;color:var(--text-sub)}.info-box{background:rgba(51,65,85,0.4);border-radius:14px;padding:12px 14px;font-size:0.8rem;color:var(--text-sub);line-height:1.6}.info-box span{color:var(--text-main);font-weight:600}@keyframes pulse{0%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(0.8)}100%{opacity:1;transform:scale(1)}}</style></head><body><div class="container"><div class="header"><h1>الرصيد التراكمي المباشر</h1><div class="badge"><span class="dot"></span> عداد حقيقي بالثواني</div></div><div class="main-card"><div class="label">المبلغ التراكمي الآن</div><div class="amount" id="totalAmount">0.0000</div><div class="currency">ريال سعودي</div></div><div class="stats-grid"><div class="stat-item"><div class="lbl">الزيادة كل ثانية</div><div class="val" id="perSecondRate">0.002831</div></div><div class="stat-item"><div class="lbl">الوقت المنقضي</div><div class="val" id="timePassed">0ي 0س 0د</div></div></div><div class="info-box">• المعدل اليومي: <span>244.63 ريال / يوم</span><br>• الأساس: <span>7,339 ريال</span> ÷ <span>30 يوم</span><br>• نقطة الانطلاق: <span>24 يوليو 2026 م</span></div></div><script>const BASE_AMOUNT=7339,DAILY_RATE=BASE_AMOUNT/30,PER_SECOND_RATE=DAILY_RATE/86400,startYear=2026,startMonth=6,startDate=24;function updateCounter(){const e=new Date,t=new Date(startYear,startMonth,startDate,0,0,0),n=e.getTime()-t.getTime();if(n<0)return void(document.getElementById("totalAmount").textContent="0.0000");const a=n/1e3,o=a*PER_SECOND_RATE,m=Math.floor(a/86400),r=Math.floor(n%(86400*1e3)/(1e3*3600)),M=Math.floor(n%(1e3*3600)/(1e3*60)),c=Math.floor(n%(1e3*60)/1e3);document.getElementById("totalAmount").textContent=o.toFixed(4),document.getElementById("timePassed").textContent=`${m}ي ${r}س ${M}د ${c}ث`}setInterval(updateCounter,100),updateCounter();</script></body></html>
