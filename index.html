<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>الرصيد التراكمي</title><style>:root{--bg:#0f172a;--card-bg:#1e293b;--accent:#10b981;--text-main:#f8fafc;--text-sub:#94a3b8;--border:#334155}*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,sans-serif}body{background-color:var(--bg);color:var(--text-main);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:16px}.container{width:100%;max-width:420px;background-color:var(--card-bg);border-radius:24px;padding:24px;box-shadow:0 20px 25px -5px rgba(0,0,0,0.3);border:1px solid var(--border)}.header{text-align:center;margin-bottom:24px}.header h1{font-size:1.25rem;color:var(--text-sub);font-weight:500;margin-bottom:6px}.badge{display:inline-block;background:rgba(16,185,129,0.15);color:var(--accent);padding:4px 12px;border-radius:20px;font-size:0.85rem;font-weight:600}.main-card{background:linear-gradient(135deg,#059669 0%,#10b981 100%);border-radius:20px;padding:24px 16px;text-align:center;color:#fff;margin-bottom:24px}.main-card .label{font-size:0.9rem;opacity:0.9;margin-bottom:8px}.main-card .amount{font-size:2.5rem;font-weight:800}.main-card .currency{font-size:1rem}.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}.stat-item{background-color:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:16px;padding:14px;text-align:center}.stat-item .val{font-size:1.1rem;font-weight:700;margin-top:4px}.stat-item .lbl{font-size:0.8rem;color:var(--text-sub)}.info-box{background:rgba(51,65,85,0.4);border-radius:14px;padding:12px 16px;font-size:0.85rem;color:var(--text-sub);line-height:1.6}.info-box span{color:var(--text-main);font-weight:600}</style></head><body><div class="container"><div class="header"><h1>الرصيد التراكمي اليومي</h1><div class="badge">تحديث تلقائي مفعل</div></div><div class="main-card"><div class="label">المبلغ التراكمي حتى اليوم</div><div class="amount" id="totalAmount">0.00</div><div class="currency">ريال سعودي</div></div><div class="stats-grid"><div class="stat-item"><div class="lbl">الزيادة اليومية</div><div class="val" id="dailyRate">244.63</div></div><div class="stat-item"><div class="lbl">عدد الأيام المنقضية</div><div class="val" id="daysPassed">0 يوم</div></div></div><div class="info-box">• الأساس: <span>7,339 ريال</span> ÷ <span>30 يوم</span><br>• بداية الحساب: <span>9 صفر 1448 هـ</span> (24 يوليو 2026 م)</div></div><script>const BASE_AMOUNT=7339,DAILY_RATE=BASE_AMOUNT/30,startYear=2026,startMonth=6,startDate=24;function calculate(){const e=new Date,t=new Date(startYear,startMonth,startDate,0,0,0),a=new Date(e.getFullYear(),e.getMonth(),e.getDate(),0,0,0),n=a.getTime()-t.getTime();let d=Math.floor(n/864e5)+1;d<0&&(d=0);const L=d*DAILY_RATE;document.getElementById("dailyRate").textContent=DAILY_RATE.toFixed(2)+" ريال",document.getElementById("daysPassed").textContent=d+" يوم",document.getElementById("totalAmount").textContent=L.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}calculate();</script></body></html>
